<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><style>.h{font:700 25px Arial,sans-serif;fill:#172033}.t{font:600 19px Arial,sans-serif;fill:#172033}.s{font:15px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:12}.fc{fill:#eaf2ff;stroke:#3973c6;stroke-width:2.5;rx:14}.power{fill:#fff4df;stroke:#d18a18;stroke-width:2;rx:12}.video{fill:#e8f7ef;stroke:#24965a;stroke-width:2;rx:12}.radio{fill:#f2eafe;stroke:#8754c7;stroke-width:2;rx:12}.arr{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}.lab{font:600 14px Arial,sans-serif;fill:#475569}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#64748b"/></marker></defs><text x="600" y="42" text-anchor="middle" class="h">75 mm 1S FPV drone — functional system architecture</text><rect x="450" y="75" width="300" height="68" class="power"/><text x="600" y="104" text-anchor="middle" class="t">1S HV LiPo · ~450 mAh</text><text x="600" y="126" text-anchor="middle" class="s">BT2.0 power connection</text><path d="M600 143V198" class="arr"/><text x="614" y="173" class="lab">VBAT</text><rect x="350" y="200" width="500" height="190" class="fc"/><text x="600" y="234" text-anchor="middle" class="h">F4 1S 5A AIO flight controller</text><text x="600" y="268" text-anchor="middle" class="t">STM32F411 · Betaflight</text><text x="600" y="298" text-anchor="middle" class="s">BMI270 IMU · integrated 4-in-1 ESC</text><text x="600" y="325" text-anchor="middle" class="s">Serial ELRS receiver · OSD · Blackbox</text><text x="600" y="357" text-anchor="middle" class="s">Central sensing, control and interface hub</text><path d="M430 390V440H190V490" class="arr"/><text x="270" y="430" class="lab">DShot / ESC outputs</text><rect x="55" y="490" width="270" height="105" class="box"/><text x="190" y="526" text-anchor="middle" class="t">4 × 0802 motors</text><text x="190" y="553" text-anchor="middle" class="s">M1 · M2 · M3 · M4</text><text x="190" y="576" text-anchor="middle" class="s">40 mm 3-blade props</text><path d="M600 390V490" class="arr"/><text x="615" y="430" class="lab">CRSF · internal</text><rect x="455" y="490" width="290" height="105" class="radio"/><text x="600" y="526" text-anchor="middle" class="t">Integrated ELRS 2.4 GHz</text><text x="600" y="553" text-anchor="middle" class="s">Pilot commands → FC</text><text x="600" y="576" text-anchor="middle" class="s">Receiver link</text><path d="M770 390V440H1000V490" class="arr"/><text x="872" y="430" class="lab">CVBS → OSD → VTX</text><rect x="875" y="490" width="270" height="105" class="video"/><text x="1010" y="526" text-anchor="middle" class="t">Analog FPV subsystem</text><text x="1010" y="553" text-anchor="middle" class="s">Caddx Ant Nano-class camera</text><text x="1010" y="576" text-anchor="middle" class="s">Separate analog VTX → goggles</text><rect x="275" y="645" width="650" height="58" fill="#f8fafc" stroke="#cbd5e1" rx="10"/><text x="600" y="670" text-anchor="middle" class="s">Conceptual functional architecture — verify exact pads and revisions before wiring.</text><text x="600" y="691" text-anchor="middle" class="s">Not a pin-level schematic or a claim of completed physical integration.</text></svg>